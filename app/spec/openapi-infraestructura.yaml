openapi: 3.0.3
info:
  title: API Infraestructura (RDLS)
  version: "1.0.0"
  description: |
    API para topología, bombas, tanques y alarmas de infraestructura.
    Basada en los endpoints FastAPI provistos.
servers:
  - url: /api
    description: Mismo origen (reverse proxy)
  - url: http://localhost:8000
    description: Desarrollo local sin proxy
tags:
  - name: Topology
  - name: Pumps
  - name: Tanks
  - name: Alarms
paths:
  /graph/nodes:
    get:
      tags: [Topology]
      summary: Listar nodos de la topología
      operationId: listGraphNodes
      responses:
        '200':
          description: Lista de nodos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GraphNode'
              examples:
                demo:
                  value:
                    - { type: tank, asset_id: 1, name: "TA", code: "TA" }
                    - { type: pump, asset_id: 3, name: "P3", code: "P3" }
  /graph/edges:
    get:
      tags: [Topology]
      summary: Listar aristas (conexiones) de la topología
      operationId: listGraphEdges
      responses:
        '200':
          description: Lista de aristas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GraphEdge'
              examples:
                demo:
                  value:
                    - { id: 1, from_type: pump, from_id: 3, from_name: "P3", from_code: "P3",
                        to_type: manifold, to_id: 10, to_name: "MC", to_code: "MC",
                        pipe_diameter_mm: 8, length_m: 120.5, is_active: true }
  /pumps:
    get:
      tags: [Pumps]
      summary: Listar bombas
      operationId: listPumps
      responses:
        '200':
          description: Lista de bombas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PumpRow'
              examples:
                demo:
                  value:
                    - { id: 1, name: "P1" }
                    - { id: 2, name: "P2" }
  /pumps/{pump_id}/latest:
    get:
      tags: [Pumps]
      summary: Última medición de una bomba
      operationId: pumpLatest
      parameters:
        - in: path
          name: pump_id
          schema: { type: integer }
          required: true
      responses:
        '200':
          description: Últimos datos (estructura dependiente de la vista v_pump_latest)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PumpLatest'
        '404':
          description: Pump or reading not found
  /pumps/{pump_id}/command:
    post:
      tags: [Pumps]
      summary: Enviar comando a una bomba
      operationId: pumpCommand
      parameters:
        - in: path
          name: pump_id
          schema: { type: integer }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PumpCommandIn'
            examples:
              start:
                value: { cmd: "START", user: "ui" }
              speed:
                value: { cmd: "SPEED", speed_pct: 60, user: "ui" }
      responses:
        '200':
          description: Comando registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PumpCommandOut'
  /tanks:
    get:
      tags: [Tanks]
      summary: Listar tanques
      operationId: listTanks
      responses:
        '200':
          description: Lista de tanques
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TankRow'
  /tanks/{tank_id}/latest:
    get:
      tags: [Tanks]
      summary: Última medición de un tanque
      operationId: tankLatest
      parameters:
        - in: path
          name: tank_id
          schema: { type: integer }
          required: true
      responses:
        '200':
          description: Últimos datos (estructura dependiente de la vista v_tank_latest)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TankLatest'
        '404':
          description: Tank or reading not found
  /tanks/{tank_id}/command:
    post:
      tags: [Tanks]
      summary: Enviar comando a un tanque
      operationId: tankCommand
      parameters:
        - in: path
          name: tank_id
          schema: { type: integer }
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TankCommandIn'
            examples:
              escenario:
                value: { cmd: "SCENARIO", user: "ui", payload: { name: "Emergencia" } }
              set_level:
                value: { cmd: "SET_TANK_LEVEL", user: "ui", payload: { level_pct: 75 } }
              set_valve:
                value: { cmd: "SET_VALVE", user: "ui", payload: { valve: "V10", state: "open" } }
      responses:
        '200':
          description: Comando registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TankCommandOut'
  /alarms:
    get:
      tags: [Alarms]
      summary: Listar alarmas
      operationId: listAlarms
      parameters:
        - in: query
          name: active
          description: Filtra por estado de la alarma
          schema: { type: boolean }
      responses:
        '200':
          description: Lista de alarmas (estructura dependiente de la tabla alarms)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlarmRow'
components:
  schemas:
    GraphNode:
      type: object
      properties:
        type: { type: string, description: "tank | pump | valve | manifold" }
        asset_id: { type: integer }
        name: { type: string }
        code: { type: string, description: "Código de nodo (p.ej. TA, P1, MC)" }
      required: [type, asset_id, name, code]
    GraphEdge:
      type: object
      properties:
        id: { type: integer }
        from_type: { type: string }
        from_id: { type: integer }
        from_name: { type: string }
        from_code: { type: string }
        to_type: { type: string }
        to_id: { type: integer }
        to_name: { type: string }
        to_code: { type: string }
        pipe_diameter_mm: { type: number, nullable: true }
        length_m: { type: number, nullable: true }
        is_active: { type: boolean, nullable: true }
      required: [id, from_type, from_id, from_name, from_code, to_type, to_id, to_name, to_code]
    PumpRow:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
      required: [id, name]
    TankRow:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
      required: [id, name]
    PumpLatest:
      type: object
      description: Estructura libre según la vista v_pump_latest
      additionalProperties: true
    TankLatest:
      type: object
      description: Estructura libre según la vista v_tank_latest
      additionalProperties: true
    PumpCommandIn:
      type: object
      properties:
        cmd:
          type: string
          description: START | STOP | AUTO | MAN | SPEED
          enum: [START, STOP, AUTO, MAN, SPEED]
        user:
          type: string
          default: api
        speed_pct:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
      required: [cmd]
    PumpCommandOut:
      type: object
      properties:
        id: { type: integer }
        pump_id: { type: integer }
        cmd: { type: string }
        status: { type: string }
        ts_created: { type: string, format: date-time }
      required: [id, pump_id, cmd, status, ts_created]
    TankCommandIn:
      type: object
      properties:
        cmd:
          type: string
          description: SCENARIO | SET_TANK_LEVEL | SET_VALVE
          enum: [SCENARIO, SET_TANK_LEVEL, SET_VALVE]
        user:
          type: string
          default: api
        payload:
          type: object
          nullable: true
          additionalProperties: true
      required: [cmd]
    TankCommandOut:
      type: object
      properties:
        id: { type: integer }
        tank_id: { type: integer }
        cmd: { type: string }
        status: { type: string }
        ts_created: { type: string, format: date-time }
      required: [id, tank_id, cmd, status, ts_created]
    AlarmRow:
      type: object
      description: Estructura libre según tabla alarms
      additionalProperties: true
